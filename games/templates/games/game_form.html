{% extends "base.html" %}
{% block content %}
<h1>{% if object %}Editar{% else %}Agregar{% endif %} juego</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Guardar</button>
    <a href="{% url 'games:game-list' %}">Cancelar</a>
</form>
{% endblock %}
