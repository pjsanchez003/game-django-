<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Game Library{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap (para diseño rápido y moderno) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilo personalizado -->
    <style>
        body {
            background-color: #0a0a0a;
            color: #f5f5f5;
            font-family: "Poppins", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav.navbar {
            background-color: #1e1e1e;
            border-bottom: 2px solid #00bfff;
        }

        footer {
            background-color: #1e1e1e;
            color: #aaa;
            text-align: center;
            padding: 10px;
            margin-top: auto;
            border-top: 1px solid #00bfff;
        }

        a {
            color: #00bfff;
        }

        a:hover {
            color: #00ffff;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🎮 Game Library</a>
            <div>
                <a href="/crear/" class="btn btn-outline-info btn-sm">+ Agregar juego</a>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>© 2025 Game Library | Proyecto Django</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
