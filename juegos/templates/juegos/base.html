<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mis Juegos{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
        <div class="container">
            <!-- Aquí usamos el namespace 'juegos' -->
            <a class="navbar-brand" href="{% url 'juegos:index' %}">🎮 Game CRUD</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a href="{% url 'juegos:crear_juego' %}" class="nav-link">➕ Agregar</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="text-center mt-5 text-muted">
        <p>© 2025 Game CRUD - Hecho con Django 💻</p>
    </footer>
</body>

</html>
